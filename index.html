<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Arquivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #1a73e8;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Seu arquivo está pronto, escolha sua pasta e poste</h1> <br><br> 
               <p>Clique no botão abaixo para abrir o documento no Google Drive.</p>
        <!-- Substitua SEU_LINK_DO_DRIVE_AQUI pelo link real -->
        <a href="https://drive.google.com/drive/folders/1EgXyPB5ZOpBINLmJWcplT2hm0Rekfjb1?usp=drive_link" class="btn" target="_blank">Acessar no Google Drive</a>
    </div>
</body>
</html>
