<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soma de Valores</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }

    h2 {
      color: #333;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #4facfe;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #0077ff;
      box-shadow: 0 0 8px rgba(0,119,255,0.5);
    }

    button {
      background: linear-gradient(135deg, #ff6a00, #ee0979);
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 15px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    #resultado {
      margin-top: 20px;
      color: #222;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Somar Dois Valores</h2>

    <input type="number" id="valor1" placeholder="Digite o primeiro valor">
    <input type="number" id="valor2" placeholder="Digite o segundo valor">

    <button onclick="somar()">Somar</button>

    <h3 id="resultado"></h3>
  </div>

  <script>
    function somar() {
      let v1 = Number(document.getElementById("valor1").value);
      let v2 = Number(document.getElementById("valor2").value);

      let soma = v1 + v2;

      document.getElementById("resultado").innerText =
        "Resultado: " + soma;
    }
  </script>

</body>
</html>
